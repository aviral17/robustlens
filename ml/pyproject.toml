[project]
name = "robustlens"
version = "0.1.0"
description = "Robustness evaluation of pretrained vision models under distribution shift"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Avi"}]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]
gradio = ["gradio>=4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robustlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
